<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720">
<rect x="0.0" y="0.0" width="940.0" height="720.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">14,492 of 14,685 vessels on the ACTIVE record hold nothing valid</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Every authorisation window expired, and the vessel is still listed as active.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">This is not yet a finding. From one capture there is no way to separate a stalled register from an annual cycle not yet entered,</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">and it must not be published as one. What was ruled out: vStatus=1, vessAll=True and vessAll=False return byte-identical files.</text>
<text x="56.0" y="128.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Two captures a month apart settle it, which is the whole argument for this repository.</text>
<rect x="300.0" y="186.0" width="513.2" height="28.0" fill="#eb6834" rx="4"/>
<rect x="815.2" y="186.0" width="6.6" height="28.0" fill="#2a78d6" rx="4"/>
<rect x="823.8" y="186.0" width="2.0" height="28.0" fill="#b8b6ad" rx="4"/>
<text x="286.0" y="205.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="600">14,685 active vessels</text>
<text x="300.0" y="238.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">14,492 — every window expired (98.7%)</text>
<text x="300.0" y="258.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">186 hold an authorisation valid past today   ·   7 carry no window at all</text>
<text x="56.0" y="298.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">How far past expiry, by ICCAT's own days-left column</text>
