<rect x="879.5" y="316.0" width="1.0" height="26.0" fill="#b8b6ad" rx="4"/>
<text x="56.0" y="360.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Median 254 days overdue, worst 619. 714 windows (2.9%) are more than a year past expiry, which no annual cycle explains.</text>
<text x="56.0" y="398.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">When the record was last told anything</text>
