<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">France and Türkiye hold half of everything ICCAT has ever set aside</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Each flag's share of the 14,685 active vessels against its share of the 44,980 inactive.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">This is a STOCK comparison and deliberately not called a rate. The inactive list accumulated over the register's whole history and</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">cannot be divided by a single snapshot of the active one. Only observed transitions give a rate, and that needs two captures.</text>
<text x="230.0" y="180.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#2a78d6" text-anchor="start" font-weight="600">share of ACTIVE</text>
