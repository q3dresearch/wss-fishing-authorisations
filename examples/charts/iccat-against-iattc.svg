<svg xmlns="http://www.w3.org/2000/svg" width="940" height="740" viewBox="0 0 940 740">
<rect x="0.0" y="0.0" width="940.0" height="740.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">ICCAT deletes what its sister commission keeps</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">The same kind of register, on the other side of the Americas, pulled on the same day.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">IATTC's Regional Vessel Register and its inactive/sunk export carry the SAME 29 columns. ICCAT's carry 87 and 35.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">So this is not how fisheries registers work — it is how one of them works, which is a checkable criticism rather than a vague one.</text>
<text x="286.0" y="198.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">ICCAT</text>
<text x="300.0" y="172.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal">live register</text>
<rect x="300.0" y="180.0" width="560.0" height="22.0" fill="#2a78d6" rx="4"/>
<text x="868.0" y="196.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">87 columns</text>
<text x="300.0" y="216.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal">exit list</text>
<rect x="300.0" y="224.0" width="225.3" height="22.0" fill="#eb6834" rx="4"/>
<text x="533.3" y="240.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#eb6834" text-anchor="start" font-weight="600">35 columns</text>
<text x="300.0" y="264.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="600">52 columns deleted at the exit, and no date anywhere</text>
<text x="286.0" y="318.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="15" fill="#0b0b0b" text-anchor="end" font-weight="600">IATTC</text>
<text x="300.0" y="292.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal">live register</text>
<rect x="300.0" y="300.0" width="186.7" height="22.0" fill="#2a78d6" rx="4"/>
<text x="494.7" y="316.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">29 columns</text>
<text x="300.0" y="336.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="start" font-weight="normal">exit list</text>
<rect x="300.0" y="344.0" width="186.7" height="22.0" fill="#2a78d6" rx="4"/>
<text x="494.7" y="360.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">29 columns</text>
<text x="300.0" y="384.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">nothing deleted; the transition is dated in prose</text>
<text x="56.0" y="430.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">What IATTC records that ICCAT does not</text>
<text x="286.0" y="465.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">a status changed in place, not a move between lists</text>
<rect x="300.0" y="454.0" width="6.0" height="14.0" fill="#2a78d6" rx="2"/>
<text x="314.0" y="465.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Active 4,713 · Inactive 9 · Sunk 3</text>
<text x="314.0" y="480.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#eb6834" text-anchor="start" font-weight="normal">ICCAT: three separate exports, no overlap</text>
<text x="286.0" y="509.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">when the vessel first entered the register</text>
<rect x="300.0" y="498.0" width="6.0" height="14.0" fill="#2a78d6" rx="2"/>
<text x="314.0" y="509.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">100% of 4,725, back to 2002</text>
<text x="314.0" y="524.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#eb6834" text-anchor="start" font-weight="normal">ICCAT: not published</text>
<text x="286.0" y="553.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">when it left</text>
<rect x="300.0" y="542.0" width="6.0" height="14.0" fill="#2a78d6" rx="2"/>
<text x="314.0" y="553.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">in Notes: “Sunk on 22 Dec 2024.”</text>
<text x="314.0" y="568.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#eb6834" text-anchor="start" font-weight="normal">ICCAT: not published</text>
<text x="286.0" y="597.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">what it was before</text>
<rect x="300.0" y="586.0" width="6.0" height="14.0" fill="#2a78d6" rx="2"/>
<text x="314.0" y="597.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">flag, dates and the name at the time</text>
<text x="314.0" y="612.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#eb6834" text-anchor="start" font-weight="normal">ICCAT: a bare previous-flag code</text>
<text x="56.0" y="688.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">One limit survives at both: 0 of 234 IATTC previous-flag entries narrate more than one change.</text>
<text x="56.0" y="710.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Neither commission keeps a flag-hop chain. That one is only reconstructable from consecutive captures.</text>
</svg>
