<svg xmlns="http://www.w3.org/2000/svg" width="940" height="740" viewBox="0 0 940 740">
<rect x="0.0" y="0.0" width="940.0" height="740.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">A vessel keeps its row and loses 54 columns</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">ICCAT's active export carries 87 columns. The inactive and inoperative exports carry 35.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Zero serial numbers overlap between the three lists, so a vessel is in exactly one and MOVES between them.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Each square below is one column of the active export. The orange ones do not survive the move, and no export records its date.</text>
