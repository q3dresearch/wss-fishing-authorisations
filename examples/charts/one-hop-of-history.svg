<text x="56.0" y="508.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">29.2% of active vessels carry an IMO number and 6.4% of inactive ones do.</text>
<text x="56.0" y="530.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">That is a cap on every join this archive can make, and a reason to record the chain while it is still visible.</text>
