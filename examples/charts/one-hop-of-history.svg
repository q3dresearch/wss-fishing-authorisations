<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580">
<rect x="0.0" y="0.0" width="940.0" height="580.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">ICCAT keeps exactly one previous flag, and one previous name</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Reflagging is the standard way a vessel escapes a sanction. The record holds a single hop.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">A vessel that changes flag twice between captures overwrites its own history, and one that changes annually for five years leaves</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">a record showing one change. Every capture adds a link that would otherwise be lost. IMO numbers, which cannot be changed, are on a</text>
<text x="56.0" y="128.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">minority of rows — so a join to any other register rests on name and flag, both of which this source shows changing.</text>
<text x="56.0" y="200.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">previous name kept</text>
<text x="306.0" y="233.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">Active  (14,685)</text>
